<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 暖白圆角方底，呼应 viewer 暖白主题 -->
  <rect width="64" height="64" rx="14" fill="#f3eee5"/>

  <!-- 三层语义节点（从上到下：epic → feature → step），代表 CodeSee 的三视图下钻 -->
  <!-- 顶层：1 个 epic 节点（暖橘） -->
  <circle cx="32" cy="16" r="5" fill="#d18044"/>
  <!-- 中层：2 个 feature 节点（深暖橘） -->
  <circle cx="20" cy="32" r="4.5" fill="#a85a2c"/>
  <circle cx="44" cy="32" r="4.5" fill="#a85a2c"/>
  <!-- 底层：3 个 step 节点（暖灰） -->
  <circle cx="14" cy="48" r="3.8" fill="#7a5a44"/>
  <circle cx="32" cy="48" r="3.8" fill="#7a5a44"/>
  <circle cx="50" cy="48" r="3.8" fill="#7a5a44"/>

  <!-- 流转箭头（语义边）—— 用 stroke 简单画 -->
  <g stroke="#d18044" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7">
    <line x1="29" y1="20" x2="22" y2="28"/>
    <line x1="35" y1="20" x2="42" y2="28"/>
  </g>
  <g stroke="#a85a2c" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.65">
    <line x1="18" y1="36" x2="15" y2="44"/>
    <line x1="22" y1="36" x2="30" y2="44"/>
    <line x1="44" y1="36" x2="34" y2="44"/>
    <line x1="46" y1="36" x2="49" y2="44"/>
  </g>
</svg>
